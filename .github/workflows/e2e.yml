name: E2E (Playwright)

on:
  push:
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        # Bundled Chromium for CI (the config only uses system Chrome locally).
        # --with-deps pulls the OS libraries Chromium needs on ubuntu-latest.
        run: npx playwright install --with-deps chromium

      - name: Build
        # Production build — CI serves it via `next start` (see playwright.config.ts).
        run: npm run build

      - name: Run Playwright e2e suite
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
